name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/marcelo-roman/eventbank-identity

jobs:
  build:
    name: Validate the realm and build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Realm is valid JSON
        run: python3 -m json.tool realm/eventbank-realm.json > /dev/null
      - run: docker build -t "$IMAGE:ci" .

  image:
    name: Container image
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
